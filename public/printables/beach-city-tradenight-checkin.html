<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Beach City Trade Night · Check In</title>
<style>
  @page { size: 11in 8.5in; margin: 0; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    color: #1a1a1a;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  .sheet {
    width: 11in;
    height: 8.5in;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ─────────── HEADER STRIP ─────────── */
  .header {
    flex: 0 0 1.7in;
    position: relative;
    color: #fff;
    padding: 0.25in 0.6in 0.25in;
    background:
      radial-gradient(ellipse at top right, rgba(14,165,233,0.85), transparent 55%),
      radial-gradient(ellipse at bottom left, rgba(6,182,212,0.7), transparent 60%),
      linear-gradient(135deg, #0c4a6e 0%, #075985 35%, #0284c7 70%, #0ea5e9 100%);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .header::before {
    content: "";
    position: absolute;
    top: -120px; right: -120px;
    width: 320px; height: 320px;
    border-radius: 50%;
    border: 22px solid rgba(255,255,255,0.07);
  }
  .header::after {
    content: "";
    position: absolute;
    bottom: -150px; left: 30%;
    width: 240px; height: 240px;
    border-radius: 50%;
    border: 18px solid rgba(255,255,255,0.05);
  }

  .title-block {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 0.12in;
  }
  .kicker-top {
    font-size: 0.28in;
    font-weight: 800;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    margin: 0;
    opacity: 0.95;
    padding-left: 0.28em; /* offset for trailing letter-spacing so visually centered */
  }
  .title-bottom {
    font-size: 0.78in;
    font-weight: 900;
    letter-spacing: 0.01em;
    line-height: 0.92;
    margin: 0;
    text-transform: uppercase;
    white-space: nowrap;
  }

  /* ─────────── ACTIONS (the heroes — huge cards) ─────────── */
  .actions {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.4in;
    padding: 0.3in 0.6in 0.2in;
    background: #fff;
    min-height: 0;
  }

  .action-card {
    border: 4px solid #075985;
    border-radius: 0.25in;
    padding: 0.2in 0.25in 0.22in;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 0.1in;
    min-height: 0;
  }

  .action-art {
    width: 100%;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0.05in 0;
    min-height: 0;
  }
  .action-art img.tap {
    width: 88%;
    max-height: 2.6in;
    height: auto;
    object-fit: contain;
  }
  .action-art img.qr {
    width: 2.6in;
    height: 2.6in;
  }

  .action-label {
    font-size: 0.58in;
    font-weight: 900;
    color: #075985;
    letter-spacing: -0.015em;
    line-height: 0.95;
    text-transform: uppercase;
  }
  .action-sub {
    font-size: 0.17in;
    color: #555;
    font-weight: 600;
    line-height: 1.3;
    margin-top: 0.02in;
  }

  /* ─────────── 2-STEP STRIP (label on top, steps below) ─────────── */
  .steps-strip {
    flex: 0 0 auto;
    padding: 0.25in 0.6in 0.3in;
    background: #f0f9ff;
    border-top: 3px solid #bae6fd;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.16in;
  }
  .steps-label {
    font-size: 0.17in;
    font-weight: 900;
    color: #075985;
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }
  .steps-list {
    display: flex;
    align-items: center;
    gap: 0.3in;
    flex-wrap: nowrap;
    justify-content: center;
  }
  .step {
    display: flex;
    align-items: center;
    gap: 0.14in;
    font-size: 0.26in;
    font-weight: 800;
    color: #0c4a6e;
    white-space: nowrap;
  }
  .step-num {
    width: 0.44in;
    height: 0.44in;
    border-radius: 50%;
    background: #075985;
    color: #fff;
    font-size: 0.24in;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .step-arrow {
    color: #0284c7;
    font-size: 0.3in;
    font-weight: 700;
  }

  /* ─────────── FOOTER ─────────── */
  .footer {
    flex: 0 0 auto;
    padding: 0.15in 0.6in 0.18in;
    background: #075985;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 0.13in;
    font-weight: 700;
    letter-spacing: 0.04em;
  }
  .footer .left { display: flex; align-items: center; gap: 0.18in; }
  .footer .brand {
    font-weight: 900;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .footer .sep {
    width: 0.05in; height: 0.05in;
    background: #fff; border-radius: 50%; opacity: 0.6;
  }
</style>
</head>
<body>

<div class="sheet">
  <!-- HEADER STRIP -->
  <header class="header">
    <div class="title-block">
      <div class="kicker-top">Trainer Center&rsquo;s</div>
      <h1 class="title-bottom">Beach City Trade Night</h1>
    </div>
  </header>

  <!-- ACTIONS — the heroes -->
  <div class="actions">

    <div class="action-card">
      <div class="action-art">
        <img class="tap" src="tap-nfc-icon-black.png" alt="" />
      </div>
      <div class="action-label">Tap to<br/>Check In</div>
      <div class="action-sub">Hold your phone here</div>
    </div>

    <div class="action-card">
      <div class="action-art">
        <img class="qr" src="qr-checkin.png" alt="" />
      </div>
      <div class="action-label">Or Scan</div>
      <div class="action-sub">Point your camera at the code</div>
    </div>

  </div>

  <!-- 2-STEP EXPLAINER STRIP -->
  <div class="steps-strip">
    <div class="steps-label">2 Steps to Check In</div>
    <div class="steps-list">
      <div class="step"><span class="step-num">1</span><span>Pick who invited you</span></div>
      <div class="step-arrow">→</div>
      <div class="step"><span class="step-num">2</span><span>Make an account to get in</span></div>
    </div>
  </div>

</div>

</body>
</html>
