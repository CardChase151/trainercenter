<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Beach City Trade Night · Check In</title>
<style>
  @page { size: 11in 8.5in; margin: 0; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    color: #1a1a1a;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  .sheet {
    width: 11in;
    height: 8.5in;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ─────────── HEADER STRIP ─────────── */
  .header {
    flex: 0 0 1.9in;
    position: relative;
    color: #fff;
    padding: 0.32in 0.6in 0.3in;
    background:
      radial-gradient(ellipse at top right, rgba(14,165,233,0.85), transparent 55%),
      radial-gradient(ellipse at bottom left, rgba(6,182,212,0.7), transparent 60%),
      linear-gradient(135deg, #0c4a6e 0%, #075985 35%, #0284c7 70%, #0ea5e9 100%);
    overflow: hidden;
    display: flex;
    align-items: stretch;
    justify-content: space-between;
    gap: 0.4in;
  }
  .header::before {
    content: "";
    position: absolute;
    top: -120px; right: -120px;
    width: 320px; height: 320px;
    border-radius: 50%;
    border: 22px solid rgba(255,255,255,0.07);
  }
  .header::after {
    content: "";
    position: absolute;
    bottom: -150px; left: 30%;
    width: 240px; height: 240px;
    border-radius: 50%;
    border: 18px solid rgba(255,255,255,0.05);
  }

  .title-block {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 0.06in;
    flex: 1;
    min-width: 0;
  }
  .kicker-top {
    font-size: 0.14in;
    font-weight: 800;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    opacity: 0.88;
  }
  .title-top {
    font-size: 0.26in;
    font-weight: 800;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    margin: 0;
    opacity: 0.95;
  }
  .title-bottom {
    font-size: 0.92in;
    font-weight: 900;
    letter-spacing: -0.025em;
    line-height: 0.92;
    margin: 0;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .header-right {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 0.12in;
    align-items: flex-end;
    text-align: right;
    flex-shrink: 0;
  }
  .date-pill {
    background: #fff;
    color: #075985;
    padding: 0.12in 0.28in;
    border-radius: 0.12in;
    font-size: 0.26in;
    font-weight: 900;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .meta-sub {
    font-size: 0.16in;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    opacity: 0.95;
    white-space: nowrap;
  }

  /* ─────────── ACTIONS (the heroes — huge cards) ─────────── */
  .actions {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.5in;
    padding: 0.55in 0.6in 0.5in;
    background: #fff;
  }

  .action-card {
    border: 4px solid #075985;
    border-radius: 0.28in;
    padding: 0.3in 0.3in 0.35in;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 0.15in;
    position: relative;
  }

  .action-num {
    width: 0.6in;
    height: 0.6in;
    border-radius: 50%;
    background: #075985;
    color: #fff;
    font-size: 0.34in;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: -0.6in;
    box-shadow: 0 0 0 10px #fff;
  }

  .action-art {
    width: 100%;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0.05in 0;
  }
  .action-art img.tap {
    width: 92%;
    max-height: 3.4in;
    height: auto;
    object-fit: contain;
  }
  .action-art img.qr {
    width: 3.4in;
    height: 3.4in;
  }

  .action-label {
    font-size: 0.58in;
    font-weight: 900;
    color: #075985;
    letter-spacing: -0.015em;
    line-height: 0.95;
    text-transform: uppercase;
  }
  .action-sub {
    font-size: 0.17in;
    color: #555;
    font-weight: 600;
    line-height: 1.3;
    margin-top: 0.02in;
  }

  /* ─────────── FOOTER ─────────── */
  .footer {
    flex: 0 0 auto;
    padding: 0.15in 0.6in 0.18in;
    background: #075985;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 0.13in;
    font-weight: 700;
    letter-spacing: 0.04em;
  }
  .footer .left { display: flex; align-items: center; gap: 0.18in; }
  .footer .brand {
    font-weight: 900;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .footer .sep {
    width: 0.05in; height: 0.05in;
    background: #fff; border-radius: 50%; opacity: 0.6;
  }
</style>
</head>
<body>

<div class="sheet">
  <!-- HEADER STRIP -->
  <header class="header">
    <div class="title-block">
      <div class="kicker-top">Trainer Center HB</div>
      <div class="title-top">Beach City</div>
      <h1 class="title-bottom">Trade Night</h1>
    </div>
    <div class="header-right">
      <div class="date-pill">Friday · May 29</div>
      <div class="meta-sub">12 PM – 10 PM · Free Entry</div>
    </div>
  </header>

  <!-- ACTIONS — the heroes -->
  <div class="actions">

    <div class="action-card">
      <div class="action-num">1</div>
      <div class="action-art">
        <img class="tap" src="tap-nfc-icon-black.png" alt="" />
      </div>
      <div class="action-label">Tap to Check In</div>
      <div class="action-sub">Hold your phone here</div>
    </div>

    <div class="action-card">
      <div class="action-num">2</div>
      <div class="action-art">
        <img class="qr" src="qr-checkin.png" alt="" />
      </div>
      <div class="action-label">Or Scan</div>
      <div class="action-sub">Point your camera at the code</div>
    </div>

  </div>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="left">
      <span class="brand">Trainer Center HB</span>
      <span class="sep"></span>
      <span>@trainercenter.pokemon</span>
    </div>
    <div>4911 Warner Ave #210, Huntington Beach</div>
  </footer>
</div>

</body>
</html>
