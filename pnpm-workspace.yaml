# pnpm 12 fails the install when a package wants to run an install script it
# was not approved for. core-js only prints a funding note; skip it, and do
# not fail the install over skipped scripts.
strictDepBuilds: false
ignoredBuiltDependencies:
  - core-js
  - core-js-pure
# create-react-app's eslint setup expects the flat npm-style layout; pnpm's
# strict layout made Netlify fail with 'Plugin react was conflicted'. Hoisted
# keeps the flat layout while still linking from the shared store.
nodeLinker: hoisted
allowBuilds:
  core-js: set this to true or false
  core-js-pure: set this to true or false
